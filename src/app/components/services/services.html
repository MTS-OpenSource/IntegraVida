<section id="servicios-section" class="services-section">

  <h2 class="services-title">
    {{ langService.translate('serviciosEspecializados') }}
  </h2>

  <div class="carousel-container">
    <button class="carousel-control prev" (click)="anterior()">
      <span class="arrow-icon">&#8249;</span>
    </button>

    <div class="service-card">
      <img [src]="servicios[indiceActual].imagen"
           [alt]="langService.translate(servicios[indiceActual].titulo)"
           class="card-image">

      <div class="card-text-overlay">
        <h3>
          {{ langService.translate(servicios[indiceActual].titulo) }}
        </h3>
      </div>
    </div>

    <button class="carousel-control next" (click)="siguiente()">
      <span class="arrow-icon">&#8250;</span>
    </button>

  </div>
</section>
